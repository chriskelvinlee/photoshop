<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Modern Photoshop</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #2b2b2b; color: #ececec; }
        #root { height: 100vh; display: flex; flex-direction: column; }
        button { background: #555; color: white; border: none; padding: 5px 10px; margin-right: 5px; cursor: pointer; border-radius: 3px; }
        button:hover { background: #666; }
    </style>
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="renderer.js"></script>
</body>
</html>
